<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Cat Gallery</title>
<style>
  body { margin: 0; background: #2b2f3a; font: 12px system-ui, sans-serif; color: #ddd; }
  .row { display: flex; gap: 0; }
  canvas { display: block; }
  #bar { padding: 6px 10px; display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
<div id="bar">
  <label>scale <input id="scale" type="range" min="1" max="4" step="0.25" value="2"></label>
  <label>bg <select id="bg"><option>split</option><option>dark</option><option>light</option></select></label>
  <label>mode <select id="mode"><option>poses</option><option>faces</option><option>props</option><option>iron</option><option>hero</option><option>enemies</option><option>avatars</option><option>lineup</option><option>nuke</option></select></label>
  <label>hero <select id="hero"></select></label>
  <label>look <select id="look"></select></label>
  <label>suit <select id="suit"></select></label>
  <label>palette <select id="pal"></select></label>
  <label>eyes <select id="eyes"></select></label>
  <label>accessory <select id="acc"></select></label>
  <label><input id="freeze" type="checkbox"> freeze</label>
</div>
<canvas id="c"></canvas>
<script src="../src/renderer/catArt.js"></script>
<script src="../src/renderer/props.js"></script>
<script src="../src/renderer/ironArt.js"></script>
<script src="../src/renderer/villains.js"></script>
<script src="../src/renderer/heroes/homelander.js"></script>
<script src="../src/renderer/heroes/thor.js"></script>
<script src="../src/renderer/heroes/hulk.js"></script>
<script src="../src/renderer/heroes/spiderman.js"></script>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const $ = (id) => document.getElementById(id);
for (const k of Object.keys(CatArt.PALETTES)) $('pal').add(new Option(k));
for (const k of Object.keys(CatArt.EYE_COLORS)) $('eyes').add(new Option(k));
$('acc').add(new Option('(none)', ''));
for (const k of Object.keys(CatArt.ACCESSORIES)) $('acc').add(new Option(k));
for (const k of Object.keys(IronArt.SUITS)) $('suit').add(new Option(k));
for (const k of Object.keys(HeroArts)) if (HeroArts[k].makeRig) $('hero').add(new Option(k));
const IRON = ['stand','idleLook','gauntlet','walk','crouch','hover','flyUp','fly','land','aim','blast','unibeam','missile','punch','thumbsUp','salute','stagger','down','powerDown','held'];
// enemies mode: kind or kind:state (Ultron's army, then the villains in their attack poses)
const ENEMY_KINDS = ['drone','mini','walker','tank','doombot','thanos','thanos:charging','thanos:power','thanos:throw','thanos:slam','thanos:snap','doom','doom:firing','doom:storm','doom:summon','doom:shield','kang','kang:burst','kang:freeze','kang:squad','kang:warp','galactus','galactus:charging','galactus:orbs','galactus:stomp','galactus:drain','galactus:meteors'];
// avatars mode: every villain's portrait, big and menu-sized; lineup: heroes next to the villains, same scale
const AVATARS = ['drone','mini','walker','tank','doombot','thanos','doom','kang','galactus'];
const LINEUP = ['ironman','hulk','walker','tank','thanos','doom','kang','galactus'];
const NUKE = ['t=0.15','t=0.6','t=1.5','t=3','t=5','t=8','bomb','target','shockwave','brace'];
const params = new URLSearchParams(location.search);
if (params.get('mode')) $('mode').value = params.get('mode');
if (params.get('scale')) $('scale').value = params.get('scale');
if (params.get('bg')) $('bg').value = params.get('bg');
if (params.get('pal')) $('pal').value = params.get('pal');
if (params.get('eyes')) $('eyes').value = params.get('eyes');
if (params.get('acc')) $('acc').value = params.get('acc');
if (params.get('hero')) $('hero').value = params.get('hero');
if (params.get('suit')) $('suit').value = params.get('suit'); // ?mode=iron&suit=hulkbuster
// ?mode=hero&hero=hulk&look=grey — every pose of that hero (HeroArts[id].POSES)
function fillLooks() {
  const A = HeroArts[$('hero').value];
  $('look').innerHTML = '';
  $('look').add(new Option('(default)', ''));
  for (const k of Object.keys((A && A.looks) || {})) $('look').add(new Option(k));
  if (params.get('look')) $('look').value = params.get('look');
}
fillLooks();
$('hero').addEventListener('change', fillLooks);

const POSES = ['stand','walk','run','sit','sitFront','loaf','curl','lieSide','held','pounce','fall','crouch','standUp','beg','scratchFront','eat','squat','cover','stretch','groom','roll','arch','dizzy','shake','catch','box','ghost'];
const FACES = [
  ['neutral', {}], ['happy', {eyes:'happy', mouth:'smile', blush:0.6}], ['love', {eyes:'heart', mouth:'smile', blush:1}],
  ['sad', {eyes:'sad', open:0.8, mouth:'frown', brows:'sad'}], ['starving', {eyes:'sad', open:0.55, mouth:'frown', tear:1, brows:'sad'}],
  ['sleepy', {open:0.38}], ['asleep', {eyes:'closed'}], ['angry', {eyes:'angry', mouth:'hiss', mouthOpen:1, anger:1, brows:'angry'}],
  ['scared', {eyes:'wide', mouth:'o', sweat:1}], ['hunt', {eyes:'wide', pupil:1}], ['strain', {eyes:'squeeze', mouth:'flat'}],
  ['dizzy', {eyes:'spiral', mouth:'wobble'}], ['beg', {eyes:'sparkle', mouth:'o'}], ['meow', {mouth:'meow', mouthOpen:1}],
  ['yawn', {eyes:'closed', mouth:'yawn', mouthOpen:1}], ['blep', {mouth:'tongue'}], ['annoyed', {eyes:'flat', mouth:'flat'}], ['dead', {eyes:'x', mouth:'flat'}],
];
function draw(T) {
  const S = +$('scale').value;
  const mode = $('mode').value;
  const cols = +(params.get('cols') || (mode === 'faces' ? 6 : 7));
  const cw = 130 * S, ch = (mode === 'faces' ? 110 : 140) * S;
  const HA = HeroArts[$('hero').value] || HeroArts.ironman;
  let items = mode === 'poses' ? POSES : mode === 'faces' ? FACES : mode === 'iron' ? IRON : mode === 'hero' ? Object.keys(HA.POSES || IronArt.POSES) : mode === 'enemies' ? ENEMY_KINDS : mode === 'avatars' ? AVATARS : mode === 'lineup' ? LINEUP : mode === 'nuke' ? NUKE : (window.PropsArt ? PropsArt.GALLERY : []);
  const only = params.get('only');
  if (only) { const set = only.split(','); items = items.filter((it) => set.includes(Array.isArray(it) ? it[0] : (it.name || it))); }
  const rows = Math.ceil(items.length / cols);
  const W = cols * cw, Hh = rows * ch;
  const dpr = window.devicePixelRatio || 1;
  if (c.width !== W * dpr || c.height !== Hh * dpr) { c.width = W * dpr; c.height = Hh * dpr; c.style.width = W + 'px'; c.style.height = Hh + 'px'; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  items.forEach((it, i) => {
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    const bg = $('bg').value;
    const light = bg === 'light' || (bg === 'split' && ((i + Math.floor(i / cols)) % 2 === 0));
    ctx.fillStyle = light ? '#f4f5f8' : '#2d3140';
    ctx.fillRect(x, y, cw, ch);
    ctx.fillStyle = light ? '#555' : '#aaa';
    ctx.fillText(Array.isArray(it) ? it[0] : (it.name || it), x + 6, y + 14);
    ctx.save();
    if (mode === 'hero') {
      const body = HA.body || 1;
      ctx.translate(x + cw / 2, y + ch * 0.86);
      ctx.scale(S * body * (+(params.get('zoom') || 1)), S * body * (+(params.get('zoom') || 1)));
      const a = { x: Math.cos(Math.sin(T) * 0.8 - 0.3), y: Math.sin(Math.sin(T) * 0.8 - 0.3) };
      const h = { mode: 'ground', vx: 120, vy: 0, facing: 1, speed: 120, line: null, rage: 60 };
      const rig = HA.makeRig(it, { t: T % 2, T, phase: T * 6, aim: a, m: { charge: 0.5 + 0.5 * Math.sin(T * 5), beam: 1, air: false, h } });
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(0, 0, 20, 4, 0, 0, Math.PI * 2); ctx.fill();
      if (it === 'held') ctx.translate(0, -100);
      HA.drawHero(ctx, rig, { look: $('look').value || undefined, suit: $('look').value || undefined, T, h });
      ctx.restore();
      return;
    }
    if (mode === 'iron') {
      const body = (IronArt.SUITS[$('suit').value] || {}).body || 1; // the Hulkbuster is bigger
      ctx.translate(x + cw / 2, y + ch * 0.86);
      ctx.scale(S * body, S * body);
      const a = { x: Math.cos(Math.sin(T) * 0.8 - 0.3), y: Math.sin(Math.sin(T) * 0.8 - 0.3) };
      const rig = IronArt.makeRig(it, { t: T % 2, T, phase: T * 6, aim: a, m: { charge: 0.5 + 0.5 * Math.sin(T * 5), beam: 1, air: false } });
      ctx.fillStyle = 'rgba(0,0,0,0.2)';
      ctx.beginPath(); ctx.ellipse(0, 0, 20, 4, 0, 0, Math.PI * 2); ctx.fill();
      if (it === 'held') ctx.translate(0, -100);
      IronArt.drawHero(ctx, rig, { suit: $('suit').value, T, h: { mode: 'ground', pose: it } });
      ctx.restore();
      return;
    }
    if (mode === 'nuke') {
      ctx.translate(x + cw / 2, y + ch * 0.9);
      ctx.scale(S, S);
      if (it.startsWith('t=')) { const t = +it.slice(2); IronArt.drawScorch(ctx, 0, 0, 50, 1); IronArt.drawMushroom(ctx, 0, -2, t, 34); IronArt.drawShockwave(ctx, 0, -2, t * 30, t); }
      else if (it === 'bomb') IronArt.drawBomb(ctx, 0, -20, T);
      else if (it === 'target') { ctx.scale(0.45, 0.45); IronArt.drawNukeTarget(ctx, 0, -110, T, 1); }
      else if (it === 'shockwave') IronArt.drawShockwave(ctx, 0, -40, 40, 0.8);
      else if (it === 'brace') IronArt.drawHero(ctx, IronArt.makeRig('brace', { t: 1, T, phase: 0, m: {} }), { suit: $('suit').value, T });
      ctx.restore();
      return;
    }
    if (mode === 'enemies') {
      const [kind, state] = it.split(':');
      const air = kind === 'drone' || kind === 'mini' || kind === 'doom' || kind === 'doombot';
      const zoom = (+(params.get('zoom') || 1)) * (kind === 'galactus' ? 0.13 : kind === 'thanos' ? 0.5 : kind === 'doom' ? 0.6 : kind === 'kang' ? 0.66 : kind === 'doombot' ? 0.9 : 1);
      ctx.translate(x + cw / 2, y + ch * (air ? 0.55 : 0.94));
      ctx.scale(S * zoom, S * zoom);
      const charge = state ? 0.5 + 0.5 * Math.sin(T * 3) : 0;
      IronArt.drawEnemy(ctx, { kind, hp: 2, maxHp: 3, facing: 1, phase: T * 5, charge, vx: 200 * Math.sin(T), state: state && state !== 'shield' && state !== 'warp' ? state : 'idle', stateT: 0.25, shield: state === 'shield' ? 2 : 0, warp: state === 'warp' ? Date.now() - 250 : 0 }, T);
      ctx.restore();
      return;
    }
    if (mode === 'avatars') {
      const big = Math.min(cw, ch) - 34;
      ctx.translate(x + 6, y + 22);
      VillainArt.drawAvatar(ctx, it, big, T);
      ctx.translate(big + 4, 0);
      VillainArt.drawAvatar(ctx, it, 22, T, { round: true });
      ctx.translate(0, 26);
      VillainArt.drawAvatar(ctx, it, 18, T);
      ctx.restore();
      return;
    }
    if (mode === 'lineup') {
      // everything at the same scale on one floor (Galactus scaled down 4× — he'd fill the page)
      ctx.translate(x + cw / 2, y + ch * 0.95);
      const z = S * 0.5 * (it === 'galactus' ? 0.25 : 1);
      ctx.scale(z, z);
      ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(-60, 0, 120, 2);
      if (it === 'ironman') IronArt.drawHero(ctx, IronArt.makeRig('stand', { t: 0, T, phase: 0, m: {} }), { suit: 'classic', T, h: { mode: 'ground', pose: 'stand' } });
      else if (it === 'hulk') { ctx.scale(HeroArts.hulk.body || 1.4, HeroArts.hulk.body || 1.4); HeroArts.hulk.drawHero(ctx, HeroArts.hulk.makeRig('stand', { t: 0, T, phase: 0, m: { h: {} } }), { T, h: { mode: 'ground' } }); }
      else IronArt.drawEnemy(ctx, { kind: it, hp: 1, maxHp: 1, facing: 1, phase: 0, charge: 0, vx: 0, state: 'idle', noBar: true }, T);
      ctx.restore();
      return;
    }
    if (mode === 'props') {
      ctx.translate(x + cw / 2, y + ch * 0.62);
      ctx.scale(S, S);
      it.draw(ctx, T);
    } else {
      const name = mode === 'poses' ? it : (i % 3 === 0 ? 'sitFront' : i % 3 === 1 ? 'stand' : 'sit');
      const face = mode === 'faces' ? it[1] : {};
      const pose = CatArt.makePose(name, { t: T, T, phase: T * 9, m: name === 'crouch' ? { wiggle: 1 } : name === 'standUp' ? { scratch: 1 } : name === 'eat' ? { chew: 1 } : {}, k: name === 'held' ? 0.25 * Math.sin(T * 2) : 0 });
      const oy = name === 'held' ? -0.5 : 0;
      ctx.translate(x + cw / 2, y + ch * (mode === 'faces' ? 0.8 : 0.78) + oy * ch);
      ctx.scale(S, S);
      if (pose.shadow.rx > 0) {
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.beginPath(); ctx.ellipse(0, 0, pose.shadow.rx, pose.shadow.ry, 0, 0, Math.PI * 2); ctx.fill();
      }
      CatArt.drawCatAlpha(ctx, pose, face, { T, palette: $('pal').value, eyes: $('eyes').value, accessory: $('acc').value || null }, name === 'ghost' ? 0.55 : 1);
    }
    ctx.restore();
  });
}
let t0 = performance.now(), frozenT = 1.3;
function loop(now) {
  const T = $('freeze').checked ? frozenT : (now - t0) / 1000;
  draw(T);
  requestAnimationFrame(loop);
}
if (params.get('freeze')) { $('freeze').checked = true; frozenT = +params.get('freeze'); }
requestAnimationFrame(loop);
</script>
</body>
</html>
