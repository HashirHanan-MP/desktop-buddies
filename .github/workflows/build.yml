# Builds every edition for Windows, macOS and Linux on their native runners:
# the full Desktop Buddies (all characters) and one app per character —
# Desktop Cat, Desktop Iron Man, Desktop Homelander, Desktop Hulk and Desktop Spider-Man.
# Push a tag like v3.0.0 (or run it manually) and download the installers
# from the workflow run's "Artifacts" section.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        edition: [all, cat, ironman, homelander, hulk, spiderman]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/build-editions.js ${{ matrix.edition }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-${{ matrix.os }}
          path: |
            dist/${{ matrix.edition }}/*.exe
            dist/${{ matrix.edition }}/*.dmg
            dist/${{ matrix.edition }}/*.zip
            dist/${{ matrix.edition }}/*.AppImage
            dist/${{ matrix.edition }}/*.deb
          if-no-files-found: error
